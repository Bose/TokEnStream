    const player = document.getElementById('player');
    const stemButtons = document.getElementById('stem-buttons');
    const runButtons = document.getElementById('run-buttons');

    function renderButtons(container, values, current, onSelect) {
      container.innerHTML = '';
      values.forEach(value => {
        const button = document.createElement('button');
        button.textContent = value;
        button.className = value === current ? 'active' : '';
        button.addEventListener('click', () => onSelect(value));
        container.appendChild(button);
      });
    }

    function loadClip(stem, label, resetTime) {
      const wasPaused = player.paused;
      const savedTime = player.currentTime;

      player.src = AUDIO[stem][label];
      player.load();

      player.addEventListener('loadedmetadata', function once() {
        player.removeEventListener('loadedmetadata', once);
        if (!resetTime) {
          player.currentTime = Math.min(savedTime, player.duration || savedTime);
        }
        if (resetTime || !wasPaused) {
          player.play();
        }
      });
    }

    function selectStem(stem) {
      if (stem === state.stem) return;
      state.stem = stem;
      renderButtons(stemButtons, STEMS, state.stem, selectStem);
      loadClip(state.stem, state.label, true);
    }

    function selectRun(label) {
      if (label === state.label) return;
      state.label = label;
      renderButtons(runButtons, LABELS, state.label, selectRun);
      loadClip(state.stem, state.label, false);
    }

    renderButtons(stemButtons, STEMS, state.stem, selectStem);
    renderButtons(runButtons, LABELS, state.label, selectRun);
    loadClip(state.stem, state.label, true);
